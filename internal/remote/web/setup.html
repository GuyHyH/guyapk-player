<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a09">
<link rel="stylesheet" href="/style.css">
<title>ตั้งค่า GuyAPK Remote</title>
</head>
<body class="scroll">
<section class="page">

    <img class="mark" src="/icon-180.png" alt="">
    <h1 data-t="title"></h1>
    <p class="sub" data-t="sub"></p>
    <ol class="steps" id="steps">
      <li><b data-t="s1"></b><span data-t="s1d"></span>
        <a class="btn gold" href="/ca.mobileconfig" data-t="download"></a></li>
      <li><b data-t="s2"></b><span data-t="s2d"></span></li>
      <li><b data-t="s3"></b><span data-t="s3d"></span></li>
    </ol>
    <p class="status" id="status"></p>
    <a class="btn gold big" id="open" hidden data-t="open"></a>
    <p class="note" data-t="note"></p>
    <button class="btn" id="lang"></button>
  </div>
</section>
<script src="/setup.js"></script>
</body>
</html>

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GuyAPK">
<meta name="theme-color" content="#0c0a09">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/style.css">
<title>GuyAPK Remote</title>
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7V5Z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.500"/></symbol>
  <symbol id="i-recents" viewBox="0 0 24 24"><rect x="5.500" y="5.500" width="13" height="13" rx="2"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.400-6.400L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.400 6.400L3 16M3 21v-5h5"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.500" y="3.500" width="7" height="7" rx="1.500"/><rect x="13.500" y="3.500" width="7" height="7" rx="1.500"/><rect x="3.500" y="13.500" width="7" height="7" rx="1.500"/><rect x="13.500" y="13.500" width="7" height="7" rx="1.500"/></symbol>
  <symbol id="i-hide" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-show" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.500 6.500l11 11M17.500 6.500l-11 11"/></symbol>
  <symbol id="i-del" viewBox="0 0 24 24"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7 6-7ZM12 10l4 4M16 10l-4 4"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.500M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></symbol>
</svg>

<section class="page" id="install" hidden>
  <div class="card">
    <img class="mark" src="/icon-180.png" alt="">
    <h1 data-t="installTitle"></h1>
    <p class="sub" data-t="installSub"></p>
    <ol class="steps">
      <li><span data-t="install1"></span><svg class="ic inline"><use href="#i-share"/></svg></li>
      <li data-t="install2"></li>
      <li data-t="install3"></li>
    </ol>
    <button class="btn" id="skipInstall" data-t="installSkip"></button>
  </div>
</section>

<section class="page" id="pair" hidden>
  <div class="card narrow">
    <img class="mark" src="/icon-180.png" alt="">
    <h1 data-t="pairTitle"></h1>
    <p class="sub" data-t="pairSub"></p>
    <div class="dots" id="dots" aria-live="polite"></div>
    <p class="err" id="pairErr" hidden></p>
    <div class="pad" id="pad"></div>
  </div>
</section>

<section id="player" hidden>
  <div id="stage">
    <canvas id="screen" width="1" height="1"></canvas>
    <div id="overlay">
      <img class="mark small" src="/icon-180.png" alt="">
      <p id="overlayText"></p>
      <div class="progress" id="overlayBar" hidden><i></i></div>
      <button class="btn gold" id="overlayBtn" hidden></button>
    </div>
  </div>
  <nav id="bar" aria-label="Android">
    <button data-key="back" data-l="back"><svg class="ic"><use href="#i-back"/></svg></button>
    <button data-key="home" data-l="home"><svg class="ic"><use href="#i-home"/></svg></button>
    <button data-key="recents" data-l="recents"><svg class="ic"><use href="#i-recents"/></svg></button>
    <span class="sep"></span>
    <button id="rotate" data-l="rotate"><svg class="ic"><use href="#i-rotate"/></svg></button>
    <button id="apps" data-l="apps"><svg class="ic"><use href="#i-grid"/></svg></button>
    <span class="sep"></span>
    <button id="lang" class="text" aria-label="Language"></button>
    <button id="hideBar" data-l="hide"><svg class="ic"><use href="#i-hide"/></svg></button>
  </nav>
  <button id="showBar" data-l="show" hidden><svg class="ic"><use href="#i-show"/></svg></button>
</section>

<aside id="drawer" hidden>
  <div class="drawer-sheet">
    <header><h2 data-t="appsTitle"></h2><button id="closeDrawer" data-l="close"><svg class="ic"><use href="#i-x"/></svg></button></header>
    <div class="grid" id="grid"></div>
  </div>
</aside>

<div id="toast" role="status" hidden></div>
<script src="/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GuyAPK</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="boot">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c4"/><stop offset=".45" stop-color="#e8c478"/><stop offset="1" stop-color="#9c6a26"/>
    </linearGradient>
    <symbol id="logo" viewBox="0 0 64 64">
      <path fill="url(#leaf)" d="M32 2c5 8 11 12 20 13-1 9 3 15 10 17-7 2-11 8-10 17-9 1-15 5-20 13-5-8-11-12-20-13 1-9-3-15-10-17 7-2 11-8 10-17 9-1 15-5 20-13Z"/>
      <path fill="#14100d" d="M32 12c3.600 5 8 8 14 9-.6 6 2 10.500 7 11-5 .5-7.600 5-7 11-6 1-10.400 4-14 9-3.600-5-8-8-14-9 .6-6-2-10.500-7-11 5-.5 7.600-5 7-11 6-1 10.400-4 14-9Z"/>
      <path fill="url(#leaf)" d="M26.500 22.800c0-1.500 1.600-2.400 2.900-1.700l15 9.200c1.200.8 1.200 2.600 0 3.400l-15 9.200c-1.300.7-2.900-.2-2.900-1.700V22.800Z"/>
    </symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6.500" y="2.500" width="11" height="19" rx="2.500"/><path d="M10.500 18.500h3"/></symbol>
    <symbol id="i-tablet" viewBox="0 0 24 24"><rect x="4" y="2.500" width="16" height="19" rx="2.500"/><path d="M10.500 18.500h3"/></symbol>
    <symbol id="i-fold" viewBox="0 0 24 24"><rect x="3.500" y="4" width="17" height="16" rx="2.500"/><path d="M12 4v16" stroke-dasharray="2 2"/></symbol>
    <symbol id="i-custom" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.300-4L3.500 9.500M3.500 4v5.500H9M4 13a8 8 0 0 0 14.300 4l2.200-2.500M20.500 20v-5.500H15"/></symbol>
    <symbol id="i-portrait" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/></symbol>
    <symbol id="i-landscape" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15M5 19l7-7"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24"><path d="M12 3v18M7 21h10M5 7h14M5 7l-2.500 6a3 3 0 0 0 5 0L5 7ZM19 7l-2.500 6a3 3 0 0 0 5 0L19 7Z"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2.500 4.500 13.500H11l-1 8 8.500-11H12l1-8Z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.500v15l12.500-7.500L7 4.500Z" fill="currentColor"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.500" y="3.500" width="7" height="7" rx="1.500"/><rect x="13.500" y="3.500" width="7" height="7" rx="1.500"/><rect x="3.500" y="13.500" width="7" height="7" rx="1.500"/><rect x="13.500" y="13.500" width="7" height="7" rx="1.500"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.400 15a1.700 1.700 0 0 0 .3 1.800l.1.100a2 2 0 1 1-2.900 2.900l-.1-.1a1.700 1.700 0 0 0-2.800 1.200V21a2 2 0 1 1-4 0v-.1a1.700 1.700 0 0 0-2.900-1.200l-.1.100a2 2 0 1 1-2.800-2.900l.1-.1a1.700 1.700 0 0 0-1.200-2.800H3a2 2 0 1 1 0-4h.1a1.700 1.700 0 0 0 1.200-2.900l-.1-.1A2 2 0 1 1 7 4.200l.1.1a1.700 1.700 0 0 0 1.800.3h.1a1.700 1.700 0 0 0 1-1.500V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 2.900 1.200l.1-.1a2 2 0 1 1 2.800 2.800l-.1.100a1.700 1.700 0 0 0-.3 1.800v.1a1.700 1.700 0 0 0 1.500 1h.1a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1Z"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1.500 1.500 0 0 0 1.500 1.500h13A1.500 1.500 0 0 0 20 19v-3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7V5Z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.500"/></symbol>
    <symbol id="i-recents" viewBox="0 0 24 24"><rect x="5.500" y="5.500" width="13" height="13" rx="2"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.400-6.400L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.400 6.400L3 16M3 21v-5h5"/></symbol>
    <symbol id="i-voldown" viewBox="0 0 24 24"><path d="M4 9.500v5h3.500l5 4v-13l-5 4H4ZM16 10a3 3 0 0 1 0 4"/></symbol>
    <symbol id="i-volup" viewBox="0 0 24 24"><path d="M3 9.500v5h3.500l5 4v-13l-5 4H3ZM15 9.500a3.500 3.500 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7.500h3.500L9 5h6l1.500 2.500H20A1.500 1.500 0 0 1 21.500 9v9.500A1.500 1.500 0 0 1 20 20H4a1.500 1.500 0 0 1-1.500-1.500V9A1.500 1.500 0 0 1 4 7.500Z"/><circle cx="12" cy="13.500" r="3.500"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><path d="M12 3v9M6.300 7a8 8 0 1 0 11.400 0"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.500h6V7M6.500 7l1 13h9l1-13M10 11v5.500M14 11v5.500"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></symbol>
    <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
    <symbol id="i-max" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.500"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.500 6.500l11 11M17.500 6.500l-11 11"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.500 7A1.500 1.500 0 0 1 5 5.500h4.500l2 2.500H19A1.500 1.500 0 0 1 20.500 9.500v8A1.500 1.500 0 0 1 19 19H5a1.500 1.500 0 0 1-1.500-1.500V7Z"/></symbol>
  </defs>
</svg>

<div class="backdrop" aria-hidden="true"><div class="glow g1"></div><div class="glow g2"></div><div class="lattice"></div></div>

<header class="titlebar">
  <div class="brand"><svg class="brand-mark"><use href="#logo"/></svg><span>Guy<b>APK</b></span></div>
  <nav class="tabs" role="tablist">
    <button class="tab" data-view="play" role="tab"><svg class="ic"><use href="#i-play"/></svg><span data-t="nav.play"></span></button>
    <button class="tab" data-view="library" role="tab"><svg class="ic"><use href="#i-grid"/></svg><span data-t="nav.library"></span><em id="libCount" hidden></em></button>
    <button class="tab" data-view="remote" role="tab"><svg class="ic"><use href="#i-tablet"/></svg><span>iPad</span><i class="tab-dot" id="rmDot" hidden></i></button>
    <button class="tab" data-view="settings" role="tab"><svg class="ic"><use href="#i-gear"/></svg><span data-t="nav.settings"></span></button>
  </nav>
  <div class="title-right">
    <div class="status" id="status"><i></i><span id="statusText"></span></div>
    <div class="lang" role="group" aria-label="Language"><button data-lang="th">ไทย</button><button data-lang="en">EN</button></div>
    <div class="winctl">
      <button id="winMin" aria-label="Minimize"><svg class="ic"><use href="#i-min"/></svg></button>
      <button id="winMax" aria-label="Maximize"><svg class="ic"><use href="#i-max"/></svg></button>
      <button id="winClose" class="close" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
  </div>
</header>

<main>
  <section class="view play" id="view-play">
    <aside class="panel left">
      <h2 data-t="device.title"></h2>
      <div class="kinds" id="kinds"></div>
      <div class="models" id="models"></div>
      <form class="custom" id="custom" hidden>
        <label><span data-t="custom.w"></span><input id="cw" type="number" min="320" max="4096" inputmode="numeric"></label>
        <label><span data-t="custom.h"></span><input id="ch" type="number" min="480" max="4096" inputmode="numeric"></label>
        <label><span>DPI</span><input id="cd" type="number" min="120" max="640" inputmode="numeric"></label>
        <p class="hint" id="customHint" data-t="custom.hint"></p>
      </form>
    </aside>

    <div class="stage" id="stage">
      <div class="rings" aria-hidden="true">
        <svg viewBox="0 0 600 600">
          <g class="ring r1"><circle cx="300" cy="300" r="286" pathLength="360" stroke-dasharray="1 4"/></g>
          <g class="ring r2"><circle cx="300" cy="300" r="250" pathLength="360" stroke-dasharray="46 14"/></g>
          <circle class="ring-still" cx="300" cy="300" r="214"/>
        </svg>
      </div>
      <div class="device" id="device">
        <div class="bezel">
          <div class="screen">
            <div class="wall"></div>
            <div class="screen-ui" id="screenUi">
              <div class="clock" id="clock"></div>
              <svg class="screen-logo"><use href="#logo"/></svg>
              <div class="screen-state" id="screenState"></div>
              <div class="screen-spec" id="screenSpec"></div>
              <div class="bootbar" id="bootbar" hidden><i></i></div>
            </div>
          </div>
        </div>
      </div>
      <div class="caption"><strong id="capName"></strong><span id="capSpec"></span></div>
      <div class="actions">
        <button class="cta" id="cta"><svg class="ic"><use href="#i-play"/></svg><span id="ctaText"></span></button>
      </div>
      <div class="dock" id="dock" hidden>
        <button data-key="back" data-tip="dock.back"><svg class="ic"><use href="#i-back"/></svg></button>
        <button data-key="home" data-tip="dock.home"><svg class="ic"><use href="#i-home"/></svg></button>
        <button data-key="recents" data-tip="dock.recents"><svg class="ic"><use href="#i-recents"/></svg></button>
        <span class="sep"></span>
        <button id="dRotate" data-tip="dock.rotate"><svg class="ic"><use href="#i-rotate"/></svg></button>
        <button data-key="voldown" data-tip="dock.voldown"><svg class="ic"><use href="#i-voldown"/></svg></button>
        <button data-key="volup" data-tip="dock.volup"><svg class="ic"><use href="#i-volup"/></svg></button>
        <button id="dShot" data-tip="dock.shot"><svg class="ic"><use href="#i-camera"/></svg></button>
        <span class="sep"></span>
        <button id="dStop" class="danger" data-tip="dock.stop"><svg class="ic"><use href="#i-stop"/></svg></button>
      </div>
    </div>

    <aside class="panel right">
      <h2 data-t="orient.title"></h2>
      <div class="seg three" id="orient"></div>
      <h2 data-t="perf.title"></h2>
      <div class="perf" id="perf"></div>
      <button class="drop" id="drop">
        <svg class="ic"><use href="#i-upload"/></svg>
        <strong data-t="drop.title"></strong>
        <small data-t="drop.sub"></small>
      </button>
      <div class="recent" id="recent"></div>
    </aside>
  </section>

  <section class="view library" id="view-library" hidden>
    <div class="lib-head">
      <div><h1 data-t="lib.title"></h1><p id="libSub"></p></div>
      <div class="lib-tools">
        <input id="libSearch" type="search" data-ph="lib.search">
        <button class="btn gold" id="libAdd"><svg class="ic"><use href="#i-upload"/></svg><span data-t="lib.add"></span></button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="libEmpty" hidden>
      <svg class="empty-mark"><use href="#logo"/></svg>
      <h3 data-t="lib.emptyTitle"></h3>
      <p data-t="lib.emptyText"></p>
      <button class="btn gold" id="libEmptyAdd"><svg class="ic"><use href="#i-upload"/></svg><span data-t="lib.add"></span></button>
    </div>
  </section>

  <section class="view remote" id="view-remote" hidden>
    <div class="set-wrap wide">
      <div class="rm-head">
        <div><h1 data-t="rm.title"></h1><p data-t="rm.sub"></p></div>
        <label class="switch big" aria-label="iPad Remote"><input type="checkbox" id="rmToggle"><i></i></label>
      </div>
      <div class="card rm-off" id="rmOff">
        <svg class="rm-art"><use href="#i-tablet"/></svg>
        <div><h3 data-t="rm.offTitle"></h3><p data-t="rm.offText"></p><p class="rm-warn" data-t="rm.firewall"></p></div>
      </div>
      <div class="rm-grid" id="rmOn" hidden>
        <div class="card rm-qr">
          <h3 data-t="rm.scan"></h3>
          <img id="rmQR" alt="QR">
          <code id="rmURL"></code>
        </div>
        <div class="rm-side">
          <div class="card rm-pin">
            <h3 data-t="rm.pin"></h3>
            <div id="rmPin" aria-live="polite"></div>
            <div class="rm-pin-foot"><small id="rmExpire"></small><button class="btn" id="rmNew" data-t="rm.newPin"></button></div>
          </div>
          <div class="card">
            <h3 data-t="rm.howTitle"></h3>
            <ol class="rm-steps">
              <li data-t="rm.how1"></li><li data-t="rm.how2"></li><li data-t="rm.how3"></li><li data-t="rm.how4"></li>
            </ol>
          </div>
        </div>
      </div>
      <div class="card rm-status">
        <div class="rm-conn" id="rmConn"><i></i><span id="rmConnText"></span></div>
        <small id="rmPaired"></small>
        <button class="btn" id="rmUnpair" data-t="rm.unpair"></button>
      </div>
    </div>
  </section>

  <section class="view settings" id="view-settings" hidden>
    <div class="set-wrap">
      <h1 data-t="set.title"></h1>
      <div class="card">
        <h3 data-t="set.general"></h3>
        <div class="row"><div><b data-t="set.lang"></b><small data-t="set.langSub"></small></div>
          <div class="seg two" id="setLang"><button data-lang="th">ภาษาไทย</button><button data-lang="en">English</button></div></div>
        <div class="row"><div><b data-t="set.autolaunch"></b><small data-t="set.autolaunchSub"></small></div>
          <label class="switch"><input type="checkbox" id="setAuto"><i></i></label></div>
      </div>
      <div class="card">
        <h3 data-t="set.system"></h3>
        <dl class="facts" id="facts"></dl>
      </div>
      <div class="card">
        <h3 data-t="set.storage"></h3>
        <div class="row"><div><b data-t="set.data"></b><small id="dataPath" class="mono"></small></div>
          <button class="btn" id="openData"><svg class="ic"><use href="#i-folder"/></svg><span data-t="set.open"></span></button></div>
      </div>
      <p class="about" id="about"></p>
    </div>
  </section>
</main>

<div class="dragveil" id="dragveil" hidden><div><svg class="ic"><use href="#i-upload"/></svg><strong data-t="drag.title"></strong><small data-t="drag.sub"></small></div></div>

<div class="modal" id="installModal" hidden role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="pkg"><div class="pkg-icon" id="mIcon"></div><div><h3 id="mLabel"></h3><p id="mMeta"></p></div></div>
    <div class="chips" id="mChips"></div>
    <ol class="steps" id="mSteps"></ol>
    <p class="err" id="mErr" hidden></p>
    <div class="sheet-actions">
      <button class="btn" id="mCancel" data-t="common.cancel"></button>
      <button class="btn gold" id="mGo"></button>
    </div>
  </div>
</div>

<div class="modal" id="setupModal" hidden role="dialog" aria-modal="true">
  <div class="sheet wide">
    <div class="setup-head"><svg class="setup-mark"><use href="#logo"/></svg><div><h3 data-t="setup.title"></h3><p data-t="setup.sub"></p></div></div>
    <div id="setupBody">
      <ul class="pkglist" id="setupPkgs"></ul>
      <details class="license"><summary data-t="setup.license"></summary><pre id="setupLicense"></pre></details>
      <label class="agree"><input type="checkbox" id="setupAgree"><span data-t="setup.agree"></span></label>
    </div>
    <div id="setupProgress" hidden>
      <div class="bar"><i id="setupBar"></i></div>
      <div class="bar-meta"><span id="setupStage"></span><span id="setupPct"></span></div>
    </div>
    <p class="err" id="setupErr" hidden></p>
    <div class="sheet-actions">
      <button class="btn" id="setupLater" data-t="setup.later"></button>
      <button class="btn gold" id="setupGo" data-t="setup.go" disabled></button>
    </div>
  </div>
</div>

<div class="modal" id="confirmModal" hidden role="alertdialog" aria-modal="true">
  <div class="sheet small">
    <h3 id="cTitle"></h3><p id="cText"></p>
    <div class="sheet-actions"><button class="btn" id="cNo" data-t="common.cancel"></button><button class="btn danger" id="cYes"></button></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
